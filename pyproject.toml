[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ids-zero-day-detection"
version = "0.2.0"
description = "Experimental anomaly-detection prototype for network traffic"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools]
py-modules = ["simulator", "main", "report", "dashboard", "detector", "logger", "llm_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
